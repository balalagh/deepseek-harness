<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Request Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
.header{background:#1a1b26;border-bottom:1px solid #2a2b3d;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:18px;font-weight:500;color:#c0caf5}
.header a{color:#7aa2f7;text-decoration:none;font-size:13px}
.header a:hover{text-decoration:underline}
.layout{display:flex;height:calc(100vh - 57px)}
.sidebar{width:320px;min-width:280px;background:#1a1b26;border-right:1px solid #2a2b3d;overflow-y:auto;flex-shrink:0}
.sidebar-section{padding:12px 16px}
.sidebar-section h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#565f89;margin-bottom:8px}
.session-item{padding:10px 12px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:13px;color:#a9b1d6;transition:background .15s}
.session-item:hover{background:#24283b}
.session-item.active{background:#292e42;color:#c0caf5}
.session-meta{font-size:11px;color:#565f89;margin-top:3px}
.request-item{padding:8px 12px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:13px;color:#a9b1d6}
.request-item:hover{background:#24283b}
.request-item.active{background:#364A82;color:#fff}
.request-meta{font-size:11px;color:#7aa2f7;margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:#1a1b26;border-bottom:1px solid #2a2b3d;padding:0 16px;gap:0;flex-shrink:0}
.tab{padding:10px 16px;font-size:13px;color:#565f89;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:#a9b1d6}
.tab.active{color:#7aa2f7;border-bottom-color:#7aa2f7}
.content{flex:1;overflow:auto;padding:20px 24px}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#565f89;font-size:15px}
pre{background:#16161e;border:1px solid #2a2b3d;border-radius:8px;padding:16px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#c0caf5;overflow-x:auto;tab-size:2}
.tool-card{background:#1a1b26;border:1px solid #2a2b3d;border-radius:8px;margin-bottom:10px;overflow:hidden}
.tool-header{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.tool-header:hover{background:#24283b}
.tool-name{font-family:'Cascadia Code',monospace;font-size:13px;color:#7aa2f7;font-weight:600}
.tool-desc{font-size:12px;color:#9aa5ce;margin-top:2px}
.tool-toggle{color:#565f89;font-size:18px;transition:transform .2s}
.tool-toggle.open{transform:rotate(180deg)}
.tool-body{padding:0 16px 16px;display:none}
.tool-body.open{display:block}
.tool-body pre{font-size:11.5px;margin-top:8px}
.msg-block{margin-bottom:16px;border-left:3px solid #2a2b3d;padding-left:16px}
.msg-block.user{border-left-color:#9ece6a}
.msg-block.assistant{border-left-color:#bb9af7}
.msg-block.tool_call{border-left-color:#e0af68}
.msg-block.tool_result{border-left-color:#f7768e}
.msg-role{font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.msg-block.user .msg-role{color:#9ece6a}
.msg-block.assistant .msg-role{color:#bb9af7}
.msg-block.tool_call .msg-role{color:#e0af68}
.msg-block.tool_result .msg-role{color:#f7768e}
.msg-text{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#c0caf5;max-height:300px;overflow-y:auto;padding:8px 12px;background:#16161e;border-radius:6px}
.msg-text.expanded{max-height:none}
.expand-btn{font-size:11px;color:#7aa2f7;cursor:pointer;margin-top:4px;display:inline-block}
.expand-btn:hover{text-decoration:underline}
.stats{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#1a1b26;border:1px solid #2a2b3d;border-radius:8px;padding:12px 16px;min-width:120px}
.stat-val{font-size:20px;font-weight:600;color:#7aa2f7}
.stat-label{font-size:11px;color:#565f89;margin-top:2px}
.loading{text-align:center;padding:40px;color:#565f89}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;margin-left:6px}
.badge-initial{background:#1a3a2a;color:#9ece6a}
.badge-resume{background:#3a2a1a;color:#e0af68}
.badge-change{background:#2a1a3a;color:#bb9af7}
.badge-series{background:#1a2a3a;color:#7aa2f7}
</style>
</head>
<body>
<div class="header">
  <h1>LLM Request Viewer</h1>
  <a href="/">Session Viewer</a>
  <button onclick="loadSessions()" style="margin-left:auto;background:#24283b;border:1px solid #2a2b3d;color:#a9b1d6;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">Refresh</button>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>Sessions</h3>
      <div id="sessionList"><div class="loading">Loading...</div></div>
    </div>
    <div class="sidebar-section" id="requestSection" style="display:none">
      <h3>Requests</h3>
      <div id="requestList"></div>
    </div>
  </div>
  <div class="main">
    <div class="tabs" id="tabsBar" style="display:none">
      <div class="tab active" data-tab="overview">Overview</div>
      <div class="tab" data-tab="system">System Prompt</div>
      <div class="tab" data-tab="persona">Persona Prefix</div>
      <div class="tab" data-tab="runtime">Runtime Context</div>
      <div class="tab" data-tab="skills">Skills List</div>
      <div class="tab" data-tab="tools">Tools</div>
      <div class="tab" data-tab="messages">Messages</div>
    </div>
    <div class="content" id="content">
      <div class="empty">Select a session to view LLM requests</div>
    </div>
  </div>
</div>
<script>
let sessions=[], requests=[], currentReq=null, currentTab='overview';

async function loadSessions(){
  document.getElementById('sessionList').innerHTML='<div class="loading">Loading...</div>';
  try{
    const r=await fetch('/api/sessions');
    sessions=await r.json();
    renderSessions();
  }catch(e){document.getElementById('sessionList').innerHTML='<div class="loading">Failed: '+e.message+'</div>';}
}

function renderSessions(){
  const el=document.getElementById('sessionList');
  if(!sessions.length){el.innerHTML='<div class="loading">No sessions</div>';return;}
  el.innerHTML=sessions.map((s,i)=>'<div class="session-item" onclick="loadRequests('+i+')" data-i="'+i+'"><div>'+s.sessionId.replace('session-','')+'</div><div class="session-meta">'+s.workspace+' | '+fmtSize(s.size)+' | '+new Date(s.modified).toLocaleString()+'</div></div>').join('');
}

async function loadRequests(i){
  document.querySelectorAll('.session-item').forEach((e,j)=>e.classList.toggle('active',j===i));
  const s=sessions[i];
  const content=document.getElementById('content');
  content.innerHTML='<div class="loading">Loading requests...</div>';
  try{
    const r=await fetch('/api/llm-request?path='+encodeURIComponent(s.path));
    requests=await r.json();
    renderRequests();
    if(requests.length)selectRequest(0);
  }catch(e){content.innerHTML='<div class="empty">Failed: '+e.message+'</div>';}
}

function renderRequests(){
  const sec=document.getElementById('requestSection');
  const el=document.getElementById('requestList');
  if(!requests.length){sec.style.display='none';return;}
  sec.style.display='';
  el.innerHTML=requests.map((r,i)=>'<div class="request-item" onclick="selectRequest('+i+')" data-i="'+i+'"><div>Request #'+(i+1)+'</div><div class="request-meta">'+r.model+' | '+r.tools.length+' tools<span class="badge badge-'+r.reason+'">'+r.reason+'</span></div></div>').join('');
}

function selectRequest(i){
  document.querySelectorAll('.request-item').forEach((e,j)=>e.classList.toggle('active',j===i));
  currentReq=requests[i];
  document.getElementById('tabsBar').style.display='';
  renderTab();
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  t.classList.add('active');
  currentTab=t.dataset.tab;
  renderTab();
}));

function renderTab(){
  if(!currentReq)return;
  const c=document.getElementById('content');
  const r=currentReq;
  switch(currentTab){
    case 'overview':c.innerHTML=renderOverview(r);break;
    case 'system':c.innerHTML='<pre>'+esc(r.systemPrompt||'(empty)')+'</pre>';break;
    case 'persona':c.innerHTML='<pre>'+esc(r.personaPrefix||'(empty)')+'</pre>';break;
    case 'runtime':c.innerHTML='<pre>'+esc(r.runtimeContext||'(empty)')+'</pre>';break;
    case 'skills':c.innerHTML='<pre>'+esc(r.skillsList||'(empty)')+'</pre>';break;
    case 'tools':c.innerHTML=renderTools(r.tools);break;
    case 'messages':c.innerHTML=renderMessages(r.messages);break;
  }
}

function renderOverview(r){
  return '<div class="stats">'
    +'<div class="stat"><div class="stat-val">'+r.tools.length+'</div><div class="stat-label">Tools</div></div>'
    +'<div class="stat"><div class="stat-val">'+r.messages.length+'</div><div class="stat-label">Messages</div></div>'
    +'<div class="stat"><div class="stat-val">'+fmtSize(r.systemPrompt.length)+'</div><div class="stat-label">System Prompt</div></div>'
    +'<div class="stat"><div class="stat-val">'+fmtSize(r.runtimeContext.length)+'</div><div class="stat-label">Runtime Context</div></div>'
    +'<div class="stat"><div class="stat-val">'+fmtSize(r.skillsList.length)+'</div><div class="stat-label">Skills List</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
    +'<div class="stat"><div class="stat-label">Provider</div><div style="color:#c0caf5;margin-top:4px">'+esc(r.provider||'-')+'</div></div>'
    +'<div class="stat"><div class="stat-label">Model</div><div style="color:#c0caf5;margin-top:4px">'+esc(r.model||'-')+'</div></div>'
    +'<div class="stat"><div class="stat-label">Reason</div><div style="color:#c0caf5;margin-top:4px">'+esc(r.reason||'-')+'</div></div>'
    +'<div class="stat"><div class="stat-label">Reasoning Effort</div><div style="color:#c0caf5;margin-top:4px">'+esc(r.effort||'-')+'</div></div>'
    +'<div class="stat"><div class="stat-label">Max Tokens</div><div style="color:#c0caf5;margin-top:4px">'+esc(String(r.maxTokens||'-'))+'</div></div>'
    +'<div class="stat"><div class="stat-label">Session Seq</div><div style="color:#c0caf5;margin-top:4px">'+r.seq+'</div></div>'
    +'</div>';
}

function renderTools(tools){
  if(!tools.length)return '<div class="empty">No tools</div>';
  return tools.map((t,i)=>'<div class="tool-card"><div class="tool-header" onclick="toggleTool(this)"><div><div class="tool-name">'+esc(t.name)+'</div>'
    +(t.description?'<div class="tool-desc">'+esc(t.description.substring(0,120))+(t.description.length>120?'...':'')+'</div>':'')
    +'</div><div class="tool-toggle">&#9660;</div></div><div class="tool-body"><pre>'+esc(JSON.stringify(t.parameters,null,2))+'</pre></div></div>').join('');
}

function toggleTool(el){
  const body=el.nextElementSibling;
  const toggle=el.querySelector('.tool-toggle');
  body.classList.toggle('open');
  toggle.classList.toggle('open');
}

function renderMessages(msgs){
  if(!msgs.length)return '<div class="empty">No messages</div>';
  return msgs.map((m,i)=>{
    const cls=m.role;
    const label={user:'User',assistant:'Assistant',tool_call:'Tool Call',tool_result:'Tool Result'}[m.role]||m.role;
    let body='';
    if(m.role==='tool_call'){
      body='<strong>'+esc(m.name)+'</strong>\n'+esc(m.args||'');
    }else if(m.role==='assistant'){
      body=m.text||'';
      if(m.toolCalls&&m.toolCalls.length)body+='\n\nTool calls: '+m.toolCalls.map(tc=>tc.name).join(', ');
    }else{
      body=m.text||'';
    }
    const id='msg-'+i;
    const truncated=body.length>1000;
    return '<div class="msg-block '+cls+'"><div class="msg-role">'+label+'</div><div class="msg-text'+(truncated?'':' expanded')+'" id="'+id+'">'+esc(truncated?body.substring(0,1000)+'...':body)+'</div>'
      +(truncated?'<span class="expand-btn" onclick="expandMsg(\''+id+'\','+JSON.stringify(JSON.stringify(body))+')">Show full ('+fmtSize(body.length)+')</span>':'')
      +'</div>';
  }).join('');
}

function expandMsg(id,data){
  const el=document.getElementById(id);
  el.textContent=JSON.parse(data);
  el.classList.add('expanded');
  el.nextElementSibling.style.display='none';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}

loadSessions();
</script>
</body>
</html>
